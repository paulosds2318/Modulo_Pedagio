services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-toll_manager}
      POSTGRES_USER: ${POSTGRES_USER:-toll_manager}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-toll_manager_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-toll_manager} -d ${POSTGRES_DB:-toll_manager}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      args:
        FRAME_ANCESTORS: ${FRAME_ANCESTORS:-'self'}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-toll_manager}:${POSTGRES_PASSWORD:-toll_manager_dev}@db:5432/${POSTGRES_DB:-toll_manager}?schema=public
      FRAME_ANCESTORS: ${FRAME_ANCESTORS:-'self'}
      ADYEN_API_KEY: ${ADYEN_API_KEY:-}
      ADYEN_MERCHANT_ACCOUNT: ${ADYEN_MERCHANT_ACCOUNT:-}
      ADYEN_ENVIRONMENT: ${ADYEN_ENVIRONMENT:-test}
      ADYEN_API_VERSION: ${ADYEN_API_VERSION:-v71}
      ADYEN_LIVE_PREFIX: ${ADYEN_LIVE_PREFIX:-}
      ADYEN_HMAC_KEY: ${ADYEN_HMAC_KEY:-}
      CONECTCAR_API_TOKEN: ${CONECTCAR_API_TOKEN:-}
      CONECTCAR_API_URL: ${CONECTCAR_API_URL:-}
      CONECTCAR_SYNC_SECRET: ${CONECTCAR_SYNC_SECRET:-}
      CORAL_API_TOKEN: ${CORAL_API_TOKEN:-}
      CORAL_TOKEN_LOOKUP_URL: ${CORAL_TOKEN_LOOKUP_URL:-}
      CORAL_RENTALS_SYNC_SECRET: ${CORAL_RENTALS_SYNC_SECRET:-}
      WHATSAPP_API_URL: ${WHATSAPP_API_URL:-}
      WHATSAPP_API_TOKEN: ${WHATSAPP_API_TOKEN:-}
      WHATSAPP_WEBHOOK_TOKEN: ${WHATSAPP_WEBHOOK_TOKEN:-}
      CRON_SECRET: ${CRON_SECRET:-}
      OPERATIONS_API_TOKEN: ${OPERATIONS_API_TOKEN:-}
    ports:
      - "${PORT:-3000}:3000"

volumes:
  postgres_data:
